name: Release

on:
  push:
    tags:
      - 'V-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            rpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Build and upload Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "QuantLib v__VERSION__ (Beta)"
          releaseBody: |
            > ⚠️ **This is a beta release.** Features are mostly stable but you may encounter bugs or rough edges. Please [open an issue](https://github.com/alinsamba/quantlib/issues) if anything feels off, and back up your database regularly using the built-in backup feature.

            ---

            See the assets below to download and install QuantLib for your platform:

            | Platform | File(s) |
            | :--- | :--- |
            | 🪟 Windows | `.msi` or `-setup.exe` |
            | 🐧 Linux | `.deb`, `.rpm`, or `.AppImage` |
            | 🍎 macOS | Universal `.dmg` (Apple Silicon + Intel) |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
